<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>FKYC- 人生模擬遊戲</title>
<!--
  粉嶺救恩書院 BAFS 課堂自製（人生階段理財策劃）
  頂欄速度（暫停／1x／2x／4x／8x／快轉到下一個抉擇）｜無老師後台｜自由行動｜事件日記｜危急少彈｜BAFS六階段｜繁中
-->
<style>
:root {
  --bg:#0e1117; --panel:#1a1f2e; --panel2:#242b3d; --line:#353d55;
  --text:#f1f3f8; --muted:#939bb0; --accent:#5eead4; --btn:#3b82f6; --btn2:#2563eb;
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; --radius:14px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35}
body{max-width:880px;margin:0 auto;padding:8px 10px 36px}
.hidden{display:none!important}
h1{font-size:clamp(1.4rem,4vw,1.9rem);margin-bottom:.2em}
h2{font-size:clamp(1.05rem,3vw,1.35rem);margin-bottom:.25em}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:.55rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.85rem 1rem;box-shadow:0 10px 28px rgba(0,0,0,.35)}
#hud{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0e1117 88%,transparent);padding-bottom:6px;margin-bottom:2px}
.hud-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font-size:1.2rem}
.age{background:var(--panel2);border:2px solid var(--accent);border-radius:999px;padding:.22rem .75rem;font-weight:800;font-size:1.05rem}
.stage{color:var(--accent);font-weight:700;font-size:.92rem}
.prog-num{color:var(--muted);font-size:.8rem;margin-left:auto}
.flags{color:var(--muted);font-size:.75rem;margin:1px 0 4px;min-height:1em}
.debt-pill{display:inline-block;margin-left:3px;background:#7f1d1d;color:#fecaca;border:1px solid var(--danger);border-radius:999px;padding:1px 7px;font-weight:800;font-size:.72rem}

/* 進度條 18→68（無里程碑清單） */
.track-wrap{margin:2px 0 6px}
.track{height:8px;background:#2a3144;border-radius:999px;overflow:hidden;position:relative}
.track>i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#5eead4);border-radius:999px;transition:width .2s}

/* BitLife 式人生事件日記 */
.life-log{max-height:min(42vh,320px);overflow-y:auto;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.55rem .75rem;margin-bottom:.55rem;-webkit-overflow-scrolling:touch}
.log-age{color:#60a5fa;font-weight:800;font-size:.95rem;margin:.55rem 0 .2rem}
.log-age:first-child{margin-top:0}
.log-line{color:var(--muted);font-size:.84rem;line-height:1.4;padding:.1rem 0 .1rem .55rem;border-left:2px solid #3b455c;margin-bottom:.08rem}
.log-line.good{color:#86efac;border-left-color:#166534}
.log-line.bad{color:#fca5a5;border-left-color:#7f1d1d}
.log-line.fin{color:#fde68a;border-left-color:#a16207}
.log-line.note{color:#cbd5e1}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px}
@media(min-width:680px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.stat-h{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:1px}
.stat-h strong{color:var(--text);font-size:.84rem}
.bar{height:8px;background:#2a3144;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;transition:width .2s ease}
.bar.h>i{background:#34d399}.bar.w>i{background:#fbbf24}.bar.t>i{background:#60a5fa}
.bar.hap>i{background:#f472b6}.bar.rel>i{background:#a78bfa}.bar.sec>i{background:#2dd4bf}
.bar.debt>i{background:var(--danger);opacity:.7}.bar.danger>i{background:var(--danger)}
.band{margin-top:1px;font-size:.64rem;font-weight:800}
.band.vhi{color:#4ade80}.band.hi{color:#86efac}.band.mid{color:var(--warn)}
.band.lo{color:#fb923c}.band.vlo,.band.debt{color:var(--danger)}

.screen{margin-top:4px}
.hero{text-align:center;padding:.2rem 0}
.hero .emo{font-size:2.1rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:.55rem 0}
.pill{flex:1 1 130px;min-height:48px;border:2px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.pill:hover{border-color:#60a5fa}.pill.on{border-color:var(--accent);background:#134e4a;color:#ccfbf1}
.big{display:block;width:100%;margin-top:.55rem;min-height:52px;border:none;border-radius:14px;background:var(--btn);color:#fff;font-size:1.15rem;font-weight:800;cursor:pointer;font-family:inherit}
.big:hover{background:var(--btn2)}.big:disabled{opacity:.4;cursor:not-allowed}
.big.age-btn{background:linear-gradient(180deg,#22c55e,#16a34a);font-size:1.3rem;min-height:60px;letter-spacing:.03em}
.big.age-btn:hover{background:linear-gradient(180deg,#16a34a,#15803d)}
.big.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:.35rem}
.sit{font-size:1.08rem;font-weight:700;margin:.2rem 0 .65rem}
.tag{display:inline-block;font-size:.7rem;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 7px;margin-bottom:.3rem}
.tag.fin{color:#fbbf24;border-color:#fbbf24}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:2px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:.7rem .9rem;cursor:pointer;font-family:inherit}
.choice:hover{border-color:#60a5fa}.choice:active{transform:scale(.99)}.choice:disabled{opacity:.5}
.choice .k{display:inline-block;width:1.4rem;height:1.4rem;line-height:1.4rem;text-align:center;border-radius:7px;background:var(--btn);color:#fff;font-weight:800;margin-right:.35rem;font-size:.88rem}
.choice .lab{font-size:1rem;font-weight:800}
.choice .tip{display:block;margin-top:1px;color:var(--muted);font-size:.75rem;font-weight:600}
.idle-box{text-align:center;padding:.5rem 0 .15rem}
.idle-box .yr{font-size:.98rem;color:var(--muted);margin-bottom:.4rem}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(120%);z-index:80;width:min(92vw,480px);background:#0f172a;border:2px solid var(--accent);border-radius:14px;padding:.7rem .9rem;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:transform .18s,opacity .18s}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;cursor:pointer}
#toast .main{font-weight:800;margin-bottom:.25rem;font-size:.95rem}
#toast .chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.72rem;font-weight:800;padding:2px 7px;border-radius:999px;background:#1e293b}
.chip.up{color:#86efac;border:1px solid #166534}.chip.dn{color:#fca5a5;border:1px solid #7f1d1d}
#toast .hint{margin-top:4px;color:var(--muted);font-size:.68rem;text-align:right}
/* BitLife 式機會／風險彈窗 */
#popupMask{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .15s}
#popupMask.show{opacity:1;pointer-events:auto}
#popup{width:min(92vw,420px);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:1.1rem 1.15rem 1rem;box-shadow:0 20px 50px rgba(0,0,0,.55);text-align:center}
#popup.good{border-color:#22c55e}#popup.bad{border-color:#f87171}#popup.fin{border-color:#fbbf24}
#popup .p-emo{font-size:2.4rem;margin-bottom:.25rem}
#popup .p-tag{display:inline-block;font-size:.72rem;font-weight:900;border-radius:999px;padding:2px 10px;margin-bottom:.45rem}
#popup.good .p-tag{background:#14532d;color:#86efac}#popup.bad .p-tag{background:#7f1d1d;color:#fca5a5}#popup.fin .p-tag{background:#78350f;color:#fde68a}
#popup .p-main{font-weight:800;font-size:1.05rem;line-height:1.4;margin-bottom:.55rem}
#popup .p-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:.7rem}
#popup .p-ok{display:block;width:100%;min-height:48px;border:none;border-radius:12px;background:var(--btn);color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit}
#popup .p-ok:hover{background:var(--btn2)}
#popup .p-choices{display:flex;flex-direction:column;gap:7px;margin-bottom:.35rem;text-align:left}
#popup .p-choice{border:2px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:.65rem .8rem;cursor:pointer;font-family:inherit;text-align:left}
#popup .p-choice:hover{border-color:#60a5fa}
#popup .p-choice .lab{font-weight:800;font-size:.95rem;display:block}
#popup .p-choice .tip{color:var(--muted);font-size:.72rem;font-weight:600;display:block;margin-top:2px}
#popup.has-choices .p-chips{display:none}
#popup.has-choices .p-ok{display:none}
.idle-box .auto-hint{color:var(--muted);font-size:.85rem;margin-top:.35rem}
.speed-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:2px 72px 6px 0}
.speed-toolbar button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:.82rem;font-weight:800;padding:5px 9px;border-radius:6px;cursor:pointer;min-height:30px;line-height:1}
.speed-toolbar button:hover{color:var(--text);background:rgba(148,163,184,.15)}
.speed-toolbar button.on{background:#e2e8f0;color:#0f172a}
.speed-toolbar button#btnPause.on{background:#334155;color:#f8fafc}
.speed-toolbar button:disabled{opacity:.4;cursor:not-allowed}
.speed-toolbar .sep{width:1px;height:14px;background:var(--line);margin:0 5px;flex:0 0 auto}
.free-bar{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:.45rem 0 .25rem}
.free-bar.hidden{display:none!important}
.free-btn{flex:1 1 120px;min-height:44px;border:2px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;padding:.4rem .55rem}
.free-btn:hover{border-color:var(--accent)}
.free-btn.fi{border-color:#fbbf24;color:#fde68a}
.free-btn.marry{border-color:#f472b6;color:#fbcfe8}
.free-btn.kids{border-color:#86efac;color:#bbf7d0}
.free-btn.cont{border-color:#60a5fa;color:#bfdbfe;flex:1 1 100%}
body.light .free-btn.fi{color:#92400e}
body.light .free-btn.marry{color:#9d174d}
body.light .free-btn.kids{color:#166534}
body.light .free-btn.cont{color:#1d4ed8}
.big.age-btn{display:none!important}
body.light #popup{background:#fff}
#popup.major{border-width:3px;border-color:#fbbf24;box-shadow:0 20px 60px rgba(251,191,36,.25),0 0 0 1px rgba(251,191,36,.35)}
#popup.major .p-tag{background:#78350f;color:#fde68a;font-size:.8rem;letter-spacing:.02em}
#popup.major .p-main{font-size:1.15rem}
#popup .p-sub{color:var(--muted);font-size:.85rem;line-height:1.45;margin:-.25rem 0 .65rem;font-weight:600}
#popup .p-rename{display:none;text-align:left;margin:0 0 .75rem}
#popup.has-rename .p-rename{display:block}
#popup .p-rename label{display:block;font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:4px}
#popup .p-rename input{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:.55rem .7rem;font-size:1rem;font-family:inherit;font-weight:700}
#popup .p-rename input:focus{outline:none;border-color:#fbbf24}
.ending{display:inline-block;background:#134e4a;color:#ccfbf1;border:2px solid var(--accent);border-radius:999px;padding:.3rem .8rem;font-weight:900;font-size:1.05rem;margin:.25rem 0 .5rem}
.final-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:.4rem 0 .7rem}
.final-grid div{background:var(--panel2);border-radius:10px;padding:5px 7px;font-size:.82rem}
.review{list-style:none;margin:.25rem 0 .7rem;max-height:200px;overflow:auto}
.review li{background:var(--panel2);border-radius:10px;padding:.4rem .65rem;margin-bottom:4px;font-size:.8rem;color:#cbd5e1}
.review li strong{color:var(--text)}
.theme{position:fixed;top:8px;right:8px;z-index:40;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:.72rem;cursor:pointer;font-family:inherit}
body.light{--bg:#eef2f7;--panel:#fff;--panel2:#f1f5f9;--line:#cbd5e1;--text:#0f172a;--muted:#64748b}
body.light #toast{background:#fff}
body.light .pill.on{background:#ccfbf1;color:#134e4a}
body.light .speed-toolbar button.on{background:#111827;color:#fff}
body.light .speed-toolbar button#btnPause.on{background:#111827;color:#fff}
body.light .ending{background:#ccfbf1;color:#134e4a}
body.light #hud{background:linear-gradient(180deg,#eef2f7 88%,transparent)}
body.light .life-log{background:#f8fafc}
body.light .log-age{color:#2563eb}
body.light .log-line{border-left-color:#cbd5e1}
.stage-sum{margin:.2rem 0 .55rem;text-align:left}
.stage-sum .sg{margin-bottom:.4rem;background:var(--panel2);border-radius:10px;padding:.4rem .6rem}
.stage-sum .sg-h{font-weight:900;font-size:.86rem;color:var(--accent);margin-bottom:3px}
.stage-sum ul{list-style:none;margin:0;padding:0}
.stage-sum li{font-size:.8rem;line-height:1.35;padding:1px 0;font-weight:700}
.stage-sum li.ok{color:#86efac}
.stage-sum li.bad{color:#fca5a5}
.stage-sum li.muted{color:var(--muted);font-weight:600}
body.light .stage-sum li.ok{color:#15803d}
body.light .stage-sum li.bad{color:#b91c1c}

.field{margin:.45rem 0}
.field label{display:block;font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:4px}
.field input{width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:.55rem .7rem;font-size:1rem;font-family:inherit;font-weight:700}
.field input:focus{outline:none;border-color:var(--accent)}
.privacy{font-size:.72rem;color:var(--muted);margin:.35rem 0 .55rem;line-height:1.4}
.teacher-code{font-size:1.55rem;font-weight:900;letter-spacing:.14em;text-align:center;padding:.55rem;background:var(--panel2);border-radius:12px;border:2px solid var(--accent);margin:.4rem 0;color:var(--accent)}
.teacher-stats{display:flex;gap:8px;flex-wrap:wrap;margin:.4rem 0}
.teacher-stats span{flex:1;min-width:90px;background:var(--panel2);border-radius:10px;padding:.4rem .55rem;font-size:.82rem;font-weight:800;text-align:center}
.player-list{max-height:min(55vh,420px);overflow:auto;margin:.4rem 0}
.player-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;margin-bottom:6px;cursor:pointer;text-align:left}
.player-card:hover{border-color:#60a5fa}
.player-card.open{border-color:var(--accent)}
.player-card .pn{font-weight:900;font-size:.98rem}
.player-card .pm{color:var(--muted);font-size:.78rem;margin-top:2px}
.player-card .pl{color:#cbd5e1;font-size:.8rem;margin-top:4px;line-height:1.35}
.player-card .phist{margin-top:.45rem;border-top:1px solid var(--line);padding-top:.4rem;display:none}
.player-card.open .phist{display:block}
.player-card .phist ul{list-style:none;margin:0;padding:0}
.player-card .phist li{font-size:.75rem;color:#cbd5e1;margin-bottom:4px;line-height:1.35}
.toggle-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:.35rem 0;font-size:.85rem;color:var(--muted)}
.cloud-warn{background:#7f1d1d;color:#fecaca;border-radius:10px;padding:.5rem .7rem;font-size:.82rem;margin:.4rem 0;font-weight:700;line-height:1.4}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.status-dot.playing{background:#4ade80}
.status-dot.ended{background:#60a5fa}
body.light .cloud-warn{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<button type="button" class="theme" id="themeBtn">淺色</button>

<div id="hud" class="hidden">
  <div class="speed-toolbar" id="speedBar" role="toolbar" aria-label="成長速度">
    <button type="button" id="btnPause">暫停</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="speed-btn on" data-speed="1">1x</button>
    <button type="button" class="speed-btn" data-speed="2">2x</button>
    <button type="button" class="speed-btn" data-speed="4">4x</button>
    <button type="button" class="speed-btn" data-speed="8">8x</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="btnSkipToKey">快轉到下一個抉擇</button>
  </div>
  <div class="hud-top">
    <div class="avatar" id="avatar">👤</div>
    <div class="age" id="ageBadge">18 歲</div>
    <div class="stage" id="stageLabel">起步</div>
    <div class="prog-num" id="progLabel">18／68</div>
  </div>
  <div class="track-wrap">
    <div class="track"><i id="trackFill" style="width:0%"></i></div>
  </div>
  <div class="flags" id="flagLabel"></div>
  <div class="stats" id="statsBars"></div>
</div>

<section id="screen-start" class="screen card">
  <div class="hero"><div class="emo">🎲</div><h1>人生模擬</h1>
  <p class="sub">中五 BAFS 3.3　人生階段理財</p></div>
  <p class="sub">頂欄可調速度與快轉｜遇關鍵決策會停下｜BAFS 六階段｜事件日記</p>
  <button type="button" class="big" id="btnStart">開始人生</button>
</section>

<section id="screen-gender" class="screen card hidden">
  <h2>選擇角色</h2>
  <p class="sub">點一次即進入</p>
  <div class="row">
    <button type="button" class="pill" data-g="male">男</button>
    <button type="button" class="pill" data-g="female">女</button>
  </div>
</section>

<section id="screen-goals" class="screen card hidden">
  <h2>人生目標</h2>
  <p class="sub">選 1–2 個</p>
  <div class="row" id="goalRow"></div>
  <p class="sub" id="goalHint">已選 0／2</p>
  <button type="button" class="big" id="btnGoals" disabled>開始</button>
</section>

<section id="screen-play" class="screen card hidden">
  <div class="life-log" id="lifeLog" aria-live="polite"></div>
  <div id="idlePane" class="idle-box">
    <p class="yr" id="idleNote">人生自動推進中…</p>
    <p class="auto-hint" id="autoHint">出現決策時請選擇；其餘時間會自動長大</p>
    <div class="free-bar hidden" id="freeBar" aria-label="自由行動"></div>
    <button type="button" class="big age-btn" id="btnAge" aria-hidden="true">長大一歲 ▲</button>
  </div>
  <div id="eventPane" class="hidden">
    <span class="tag" id="eventTag">事件</span>
    <p class="sit" id="sitText"></p>
    <div class="choices" id="choices"></div>
  </div>
</section>

<section id="screen-end" class="screen card hidden">
  <h2>一生回顧</h2>
  <div class="ending" id="endingName"></div>
  <p class="sub" id="endingBlurb"></p>
  <div class="final-grid" id="finalStats"></div>
  <p class="sub" id="goalResult"></p>
  <h2 style="font-size:1rem;margin-top:.4rem">本局回顧</h2>
  <div class="stage-sum" id="stageSummary"></div>
  <h2 style="font-size:1rem;margin-top:.4rem">重大決策</h2>
  <ul class="review" id="reviewList"></ul>
  <button type="button" class="big" id="btnReplay">再玩一局</button>
  <button type="button" class="big ghost" id="btnHome">返回開局</button>
</section>


<div id="toast" role="status" aria-live="polite">
  <div class="main" id="toastMain"></div>
  <div class="chips" id="toastChips"></div>
  <div class="hint">點一下繼續</div>
</div>

<div id="popupMask" class="hidden" role="dialog" aria-modal="true">
  <div id="popup">
    <div class="p-emo" id="popupEmo">⚡</div>
    <div class="p-tag" id="popupTag">事件</div>
    <div class="p-main" id="popupMain"></div>
    <div class="p-sub hidden" id="popupSub"></div>
    <div class="p-rename" id="popupRename">

    pollMs: 2500
  };

  const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; /* 略過易混字 I O 0 1 */
  let cloudRoom = "";
  let cloudName = "同學A";
  let playerId = null;
  let syncTimer = null;
  let pollTimer = null;
  let expandedPlayerId = null;
  let teacherActive = false;

  function cloudConfigured() {
    return !!(CLOUD.enabled && CLOUD.baseUrl && CLOUD.baseUrl.indexOf("REPLACE_") !== 0);
  }

  function normalizeCode(c) {
    return String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  }

  function genRoomCode() {
    let s = "";
    for (let i = 0; i < 6; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    return s;
  }

  function getPlayerId() {
    try {
      let id = localStorage.getItem("fkyc_life_pid");
      if (!id) {
        id = "p_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        localStorage.setItem("fkyc_life_pid", id);
      }
      return id;
    } catch (e) {
      return "p_" + Math.random().toString(36).slice(2, 12);
    }
  }

  function cloudUrl(path) {
    const base = String(CLOUD.baseUrl || "").replace(/\/$/, "");
    return base + "/" + String(path).replace(/^\//, "").replace(/\.json$/, "") + ".json";
  }

  function cloudPut(path, data) {
    if (!cloudConfigured()) return Promise.resolve(false);
    return fetch(cloudUrl(path), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(function (res) { return res.ok; }).catch(function () { return false; });
  }

  function cloudGet(path) {
    if (!cloudConfigured()) return Promise.resolve(null);
    return fetch(cloudUrl(path)).then(function (res) {
      if (!res.ok) return null;
      return res.json();
    }).catch(function () { return null; });
  }

  function ensureRoomMeta(code) {
    if (!code || !cloudConfigured()) return;
    cloudGet("rooms/" + code + "/meta").then(function (meta) {
      if (meta && meta.title) return;
      cloudPut("rooms/" + code + "/meta", {
        createdAt: Date.now(),
        title: "FKYC- 人生模擬遊戲"
      });
    });
  }

  function buildPlayerPayload(statusOverride) {
    if (!S) return null;
    const ended = statusOverride === "ended" || S.phase === "end";
    let endingName = null;
    if (ended) {
      try {
        const k = pickEnding();
        endingName = (ENDINGS[k] && ENDINGS[k].name) || k;
      } catch (e) { endingName = null; }
    }
    const hist = (S.history || []).slice(-30);
    const last = hist.length ? hist[hist.length - 1] : null;
    return {
      name: cloudName || "同學A",
      gender: S.gender,
      goals: (S.goals || []).slice(),
      age: S.age,
      stage: (typeof bafsStage === "function") ? bafsStage(S) : "",
      stats: { h: S.h, w: S.w, t: S.t, hap: S.hap, rel: S.rel, sec: S.sec },
      status: ended ? "ended" : "playing",
      ending: endingName,
      decisions: S.decisions || 0,
      lastChoice: last ? { age: last.age, title: last.title, choice: last.choice, at: Date.now() } : null,
      history: hist,
      updatedAt: Date.now()
    };
  }

  function scheduleSync(statusOverride) {
    if (!cloudRoom || !cloudConfigured() || !playerId || !S) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      const payload = buildPlayerPayload(statusOverride);
      if (!payload) return;
      cloudPut("rooms/" + cloudRoom + "/players/" + playerId, payload);
    }, 800);
  }

  function syncNow(statusOverride) {
    if (!cloudRoom || !cloudConfigured() || !playerId || !S) return;
    clearTimeout(syncTimer);
    const payload = buildPlayerPayload(statusOverride);
    if (!payload) return;
    cloudPut("rooms/" + cloudRoom + "/players/" + playerId, payload);
  }

  function readJoinFields() {
    /* 已取消老師後台與課室同步 */
    cloudName = "同學A";
    cloudRoom = "";
  }

  function stopTeacherPoll() {
    teacherActive = false;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function setTeacherCodeDisplay(code) {
    const big = document.getElementById("teacherCodeBig");
    const inp = document.getElementById("inpTeacherCode");
    const n = normalizeCode(code);
    if (inp) inp.value = n;
    if (big) big.textContent = n || "——";
  }

  function renderPlayerList(playersObj) {
    const box = document.getElementById("playerList");
    if (!box) return;
    const rows = [];
    if (playersObj && typeof playersObj === "object") {
      Object.keys(playersObj).forEach(function (pid) {
        const p = playersObj[pid];
        if (!p || typeof p !== "object") return;
        rows.push({ id: pid, p: p });
      });
    }
    rows.sort(function (a, b) {
      return (b.p.updatedAt || 0) - (a.p.updatedAt || 0);
    });
    let playing = 0, ended = 0;
    rows.forEach(function (r) {
      if (r.p.status === "ended") ended++; else playing++;
    });
    const elP = document.getElementById("cntPlaying");
    const elE = document.getElementById("cntEnded");
    const elT = document.getElementById("cntTotal");
    if (elP) elP.textContent = String(playing);
    if (elE) elE.textContent = String(ended);
    if (elT) elT.textContent = String(rows.length);

    if (!rows.length) {
      box.innerHTML = '<p class="sub">尚無學生加入。請把課室代碼告訴同學。</p>';
      return;
    }
    box.innerHTML = "";
    rows.forEach(function (r) {
      const p = r.p;
      const card = document.createElement("div");
      card.className = "player-card" + (expandedPlayerId === r.id ? " open" : "");
      card.dataset.pid = r.id;
      const st = p.status === "ended" ? "ended" : "playing";
      const stLab = st === "ended" ? "已結束" : "進行中";
      const last = p.lastChoice
        ? (p.lastChoice.age + "歲　" + (p.lastChoice.title || "") + " → " + (p.lastChoice.choice || ""))
        : "尚未作出重大決策";
      const endNote = p.ending ? ("　｜　" + p.ending) : "";

      const pn = document.createElement("div");
      pn.className = "pn";
      const dot = document.createElement("span");
      dot.className = "status-dot " + st;
      pn.appendChild(dot);
      pn.appendChild(document.createTextNode(p.name || "同學"));

      const pm = document.createElement("div");
      pm.className = "pm";
      pm.textContent = (p.age != null ? p.age : "—") + " 歲　｜　" + (p.stage || "") +
        "　｜　" + stLab + endNote + "　｜　決策 " + (p.decisions || 0);

      const pl = document.createElement("div");
      pl.className = "pl";
      pl.textContent = "最近：" + last;

      const ph = document.createElement("div");
      ph.className = "phist";
      const htit = document.createElement("strong");
      htit.style.fontSize = ".8rem";
      htit.textContent = "決策歷程";
      ph.appendChild(htit);
      if (Array.isArray(p.history) && p.history.length) {
        const ul = document.createElement("ul");
        p.history.forEach(function (h) {
          const li = document.createElement("li");
          const strong = document.createElement("strong");
          strong.textContent = h.age + "歲　" + (h.title || "");
          li.appendChild(strong);
          li.appendChild(document.createElement("br"));
          li.appendChild(document.createTextNode("→ " + (h.choice || "")));
          ul.appendChild(li);
        });
        ph.appendChild(ul);
      } else {
        const empty = document.createElement("p");
        empty.className = "sub";
        empty.textContent = "無決策紀錄";
        ph.appendChild(empty);
      }

      card.appendChild(pn);
      card.appendChild(pm);
      card.appendChild(pl);
      card.appendChild(ph);
      card.onclick = function () {
        expandedPlayerId = (expandedPlayerId === r.id) ? null : r.id;
        document.querySelectorAll("#playerList .player-card").forEach(function (c) {
          c.classList.toggle("open", c.dataset.pid === expandedPlayerId);
        });
      };
      box.appendChild(card);
    });
  }

  function refreshTeacherPlayers() {
    const code = normalizeCode(document.getElementById("inpTeacherCode") && document.getElementById("inpTeacherCode").value);
    setTeacherCodeDisplay(code);
    if (!code || code.length !== 6) {
      const box = document.getElementById("playerList");
      if (box) box.innerHTML = '<p class="sub">請輸入或產生 6 位課室代碼。</p>';

    if (!cloudConfigured()) {
      const box = document.getElementById("playerList");
      if (box) box.innerHTML = '<p class="sub">尚未接上雲端，無法讀取學生資料。</p>';
      return;
    }
    cloudGet("rooms/" + code + "/players").then(function (data) {
      renderPlayerList(data);
    });
  }

  function startTeacherPoll() {
    stopTeacherPoll();
    teacherActive = true;
    refreshTeacherPlayers();
    const chk = document.getElementById("chkAutoPoll");

      if (chk2 && !chk2.checked) return;
      refreshTeacherPlayers();
    }, CLOUD.pollMs || 2500);

    document.getElementById("hud").classList.add("hidden");

    show("teacher");

    { id: "4", name: "④ 已婚並育有較年長子女" },
    { id: "5", name: "⑤ 接近退休" },
    { id: "6", name: "⑥ 退休" }
  ];

  function bafsStageId(s) {
    if (!s) return "1";
    if (s.retired || (s.earlyFI && s.age >= 60)) return "6";
    if (s.age >= 55 && !s.retired) return "5";
    if (s.kids && kidsOlder(s)) return "4";
    if (s.kids && kidsYoung(s)) return "3";
    if (s.married && !s.kids) return "2";
    return "1";
  }

  function verdictItemsFromOpt(opt) {
    if (!opt) return [];
    const out = [];
    const add = (ok, text) => { if (text) out.push({ ok: !!ok, text: text }); };
    const lab = opt.lab || "";
    if (opt.emergency) add(true, "早做應急金／保障");
    if (opt.save) add(true, "養成儲蓄習慣");
    if (opt.mpf) add(true, "檢視強積金／退休金");
    if (opt.will || opt.estate) add(true, "訂立遺囑／身後安排");
    if (opt.insured) add(true, "為家庭買保險");
    if (opt.eduSave) add(true, "為子女教育儲蓄");
    if (opt.savingHome && !opt.lever) add(true, "為置業儲首期");
    if (opt.hasHome && opt.lever) add(false, "高槓桿置業");
    else if (opt.hasHome && opt.prudence) add(true, "量力置業");
    else if (opt.hasHome) add(true, "完成置業");
    if (opt.biggerHome && opt.lever) add(false, "高槓桿換樓");
    else if (opt.biggerHome && opt.prudence) add(true, "量力換較大單位");
    if (opt.risk === "high" || opt.leverageStock || (opt.lever && !opt.hasHome && !opt.biggerHome))
      add(false, "高風險／高槓桿投資");
    if (opt.invest && !opt.risk && !opt.lever && !opt.leverageStock) add(true, "紀律投資／再平衡");
    if (opt.clearLeverage) add(true, "減槓桿／止蝕");
    if (opt.cutLifestyle || (opt.setLifestyle != null && opt.setLifestyle === 0)) add(true, "削減過度開支");
    if ((opt.lifestyle || 0) >= 2 && opt.d && (opt.d[1] || 0) <= -4) add(false, "生活開支升級偏快");
    if (opt.exercising) add(true, "堅持運動護健康");
    if (opt.earlyFI || opt.retire) add(true, "規劃財務自由／退休");
    if (opt.kidsAllowance) add(true, "接受子女家用（關係回饋）");
    if (opt.pet) add(true, "養寵物並預算開支");
    if (opt.refusePartner) add(true, "選擇單身路線");
    if (opt.scamHit) add(false, "墮入騙局／損失");
    if (/加班|通宵|肝/.test(lab) && opt.d && (opt.d[0] || 0) <= -2) add(false, "過度加班傷健康／時間");
    if (/亂花|全部花光|先享受|瘋狂消費|即刻花/.test(lab)) add(false, "過度消費");
    if (/不買保險|拒絕保險|不投保/.test(lab)) add(false, "拒絕基本保障");
    return out;
  }

  function pushStageVerdicts(opt, stageId) {
    if (!S || !opt) return;
    const sid = stageId || bafsStageId(S);
    if (!S.stageVerdicts) S.stageVerdicts = [];
    verdictItemsFromOpt(opt).forEach(v => {
      if (S.stageVerdicts.some(x => x.stage === sid && x.text === v.text)) return;
      S.stageVerdicts.push({ stage: sid, ok: v.ok, text: v.text, age: S.age });
    });
  }

  function stagesReached(s) {
    const set = new Set(["1"]);
    if (s.married && !s.kids) set.add("2");
    if (s.kids) { set.add("2"); set.add("3"); }
    if (s.kids && kidYears(s) >= 10) set.add("4");
    if (s.age >= 55 || s.retired || s.earlyFI) set.add("5");
    if (s.retired || (s.earlyFI && s.age >= 60) || s.age >= 68) set.add("6");
    if (!s.married) { set.delete("2"); set.delete("3"); set.delete("4"); }
    if (s.married && !s.kids) { set.delete("3"); set.delete("4"); }
    if (s.kids && kidYears(s) < 10) set.delete("4");
    if (s.age < 55 && !s.retired && !s.earlyFI) set.delete("5");
    if (!(s.retired || (s.earlyFI && s.age >= 60) || s.age >= 68)) set.delete("6");
    return BAFS_STAGES.filter(st => set.has(st.id));
  }

  function synthesizeStageVerdicts(s) {
    if (!s.stageVerdicts) s.stageVerdicts = [];
    const hasText = re => s.stageVerdicts.some(v => re.test(v.text));
    if (s.emergency && !hasText(/應急/))
      s.stageVerdicts.push({ stage: "1", ok: true, text: "早做應急金／保障", age: s.age });
    if ((s.leverageStock >= 1 || s.leverage >= 2) && !hasText(/高風險|高槓桿投資/))
      s.stageVerdicts.push({ stage: "1", ok: false, text: "高風險／高槓桿投資", age: s.age });
    if ((s.will || s.estate) && !hasText(/遺囑|身後/))
      s.stageVerdicts.push({ stage: (s.retired || (s.earlyFI && s.age >= 60)) ? "6" : "5", ok: true, text: "訂立遺囑／身後安排", age: s.age });
    if (s.mpf && !hasText(/強積金/))
      s.stageVerdicts.push({ stage: "5", ok: true, text: "檢視強積金／退休金", age: s.age });
    if (s.eduSave && s.kids && !hasText(/教育儲蓄/))
      s.stageVerdicts.push({ stage: "3", ok: true, text: "為子女教育儲蓄", age: s.age });
    if (s.kidsAllowance && !hasText(/子女家用/))
      s.stageVerdicts.push({ stage: "6", ok: true, text: "接受子女家用（關係回饋）", age: s.age });
    if (s.hasPet && !hasText(/寵物/))
      s.stageVerdicts.push({ stage: "1", ok: true, text: "養寵物並預算開支", age: s.age });
    if (s.refusedPartner && !hasText(/單身/))
      s.stageVerdicts.push({ stage: "1", ok: true, text: "選擇單身路線", age: s.age });
    if (!s.emergency && (s.bankrupt || (s.everDebt && s.w < 0)) && !hasText(/未備應急/))
      s.stageVerdicts.push({ stage: "1", ok: false, text: "未備應急金，抗風險弱", age: s.age });
    if (s.insured && !hasText(/保險/))
      s.stageVerdicts.push({ stage: s.kids ? "3" : (s.married ? "2" : "1"), ok: true, text: "為家庭買保險", age: s.age });
  }

  function stageItemScore(v) {
    const t = v.text || "";
    let sc = v.ok ? 10 : 40; /* 錯決策優先顯示 */
    if (/高風險|高槓桿|過度消費|未備應急|騙局|過度加班/.test(t)) sc += 30;
    if (/遺囑|身後|教育儲蓄|子女家用|寵物|單身|強積金|保險|應急|置業|換樓/.test(t)) sc += 20;
    if (/財務自由|退休|運動|減槓桿|削減/.test(t)) sc += 8;
    if (/紀律投資|儲蓄習慣|完成置業/.test(t)) sc += 4;
    return sc;
  }

  function pickStageItems(items) {
    const seen = new Set();
    let uniq = items.filter(v => { if (seen.has(v.text)) return false; seen.add(v.text); return true; });
    uniq.sort((a, b) => stageItemScore(b) - stageItemScore(a) || (a.age || 0) - (b.age || 0));
    return uniq.slice(0, 3);
  }

  function renderStageSummaryHTML(s) {
    synthesizeStageVerdicts(s);
    const reached = stagesReached(s);
    if (!reached.length) return "<p class='sub'>本局無階段紀錄</p>";
    return reached.map(st => {
      const items = pickStageItems((s.stageVerdicts || []).filter(v => v.stage === st.id));
      const body = items.length
        ? "<ul>" + items.map(v => "<li class='" + (v.ok ? "ok" : "bad") + "'>" + (v.ok ? "✓ " : "✗ ") + v.text + "</li>").join("") + "</ul>"
        : "<ul><li class='muted'>本階段無特別理財紀錄</li></ul>";
      return "<div class='sg'><div class='sg-h'>" + st.name + "</div>" + body + "</div>";
    }).join("");
  }

  function stageSummaryPayload(s) {
    synthesizeStageVerdicts(s);
    return stagesReached(s).map(st => ({
      id: st.id, name: st.name,
      items: pickStageItems((s.stageVerdicts || []).filter(v => v.stage === st.id))
    }));
  }

  function stage(age) {
    if (S) return bafsStage(S);
    if (age < 23) return "① 年輕而單身";
    if (age < 55) return "人生階段";
    if (age < 68) return "⑤ 接近退休";
    return "⑥ 退休";
  }

  function careerLab(c) {
    return c === "edu" ? "升學" : c === "work" ? "早職" : c === "mix" ? "半工讀" : "";
  }

  function isStudent() {
    return isStudentState(S);
  }
  function isWorking() {
    return isEmployedState(S);
  }

  function yearIncome(age) {
    if (S.retired) {
      /* 退休：強積金／年金滴水；關係好可收子女家用（唔再要求仍有 career） */
      let p = S.mpf ? 1 : 0;
      if (S.kidsAllowance) p += 2;
      if (S.estate) p += 0; /* 遺產規劃不增加現金 */
      return p;
    }
    if (!S.career) return 0;
    /* 純學生期間無工資；有兼職則小額 */
    if (isStudentState(S)) {
      let base = S.career === "mix" ? 1 : 0;
      if (S.studentPartTime) base += 1;
      return base;
    }
    let inc = 0;
    /* 收入隨資歷上升（舊版 work 中年反而跌係流失主因） */
    if (S.career === "edu") {
      if (age <= 21) inc = 0;
      else if (age <= 25) inc = 2;
      else if (age <= 32) inc = 3;
      else if (age <= 45) inc = 4;
      else if (age <= 55) inc = 4;
      else if (age <= 62) inc = 3;
      else inc = 2;
    } else if (S.career === "work") {
      if (age <= 22) inc = 2;
      else if (age <= 28) inc = 3;
      else if (age <= 38) inc = 3;
      else if (age <= 50) inc = 4;
      else if (age <= 60) inc = 3;
      else inc = 2;
    } else { /* mix */
      if (age <= 22) inc = 2;
      else if (age <= 30) inc = 2;
      else if (age <= 45) inc = 3;
      else if (age <= 58) inc = 3;
      else inc = 2;
    }
    if (age >= 28) inc += Math.min(2, S.cert || 0);
    if (age >= 40 && (S.cert || 0) >= 2) inc += 1;
    if (S.path === "specialist" && age >= 30) inc += 1;
    if (S.path === "stable") { if (age >= 32) inc += 1; } /* 穩：後期穩增 */
    if (S.path === "freelance") {
      if (Math.random() < 0.35) inc += 2; else if (Math.random() < 0.45) inc = Math.max(0, inc - 1);
    }
    if (age >= 25 && S.save) inc += 1;           /* 儲蓄／複利習慣 */
    if (age >= 35 && S.save >= 1 && S.invest >= 1) inc += 1; /* 儲＋投：審慎路徑可 FIRE */
    if (age >= 40 && S.mpf) inc += 1;
    if (S.jobLevel) inc += Math.min(3, S.jobLevel); /* 升職／轉工加薪層級 */
    if (S.sideJob) inc += Math.min(2, S.sideJob);   /* 副業每年現金 */
    if (S.lightWorkOnly && !S.earlyFI) inc = Math.max(1, Math.floor(inc * 0.6));
    /* 投資唔再每年穩賺；只係偶爾小額（見 yearlyPass 市場） */
    if (S.earlyFI) inc = Math.max(1, Math.floor(inc * 0.35)); /* FIRE：被動／少量，唔歸零 */
    else if (S.semiRetired) inc = Math.max(1, Math.floor(inc * 0.55));
    if (S.kidsAllowance && (S.earlyFI || age >= 58) && !S.retired) inc += 1;
    if (S.w < 0 && inc > 0) inc = Math.max(0, Math.floor(inc * 0.75));
    if (age >= 65 && !S.retired) inc = Math.max(0, Math.floor(inc * 0.55));
    return inc;
  }

  function yearLivingCost(age) {
    let cost = 1; /* 基本生活 */
    if (age >= 40) cost += 1; /* 延後「中年開支升」——35 起跳會令初家太緊 */
    if (S.partner && !S.married) cost += 1; /* 約會／戀愛開支 */
    if (S.hasPet) cost += 1; /* 寵物年費／食糧／日常護理 */
    /* 單身無伴：朋友聚會／應酬開支略增（對比家庭線） */
    if (isSingleLife(S) && age >= 25) cost += (age % 2 === 0 ? 1 : 0);
    /* 年幼／年長仍分明，但唔再壓垮審慎路徑 */
    if (kidsYoung(S)) cost += 2;
    else if (kidsOlder(S) && kidYears(S) < 22) cost += S.eduSave ? 2 : 3;
    else if (S.kids && kidYears(S) < 26) cost += 1;
    if (S.eduSave && kidsOlder(S) && kidYears(S) < 22) cost += 0; /* 有教育儲＝已在決策付過，唔雙重加碼 */
    if (S.hasCar) cost += 1;
    if (S.renting && !S.hasHome) cost += 1;
    if (S.biggerHome) cost += 1;
    if (S.spouseStayHome && kidsYoung(S)) cost += 1; /* 單薪開支感↑（已減雙重） */
    if (age >= 60 && !S.retired) cost += 1;
    if (S.w < 0) cost += 1;
    if (S.path === "freelance") cost += (age % 3 === 0 ? 1 : 0);
    if (S.lifestyle >= 2) cost += Math.min(3, S.lifestyle); /* FIRE 享受：有上限 */
    if (S.earlyFI && !S.retired && S.lifestyle >= 2) cost += 1;
    return cost;
  }

  function yearlyPass(age) {
    const d = [0, 0, 0, 0, 0, 0];
    /* 青壯年：輕微健康下滑；中年已體弱則加速 */
    if (age >= 25 && age < 55) {
      d[0] -= 1;
      if (age % 4 === 0 && age >= 30) d[0] -= 1;
      if (age >= 40 && S.h < 40) d[0] -= 1;
    }
    /* 晚年自然遞減：55–64 每年 −2；65+ 每年 −3（體弱線約 60–63 可歸零；健康／運動線仍可达 68） */
    if (age >= 55 && age < 65) d[0] -= 2;
    if (age >= 65) d[0] -= 3;
    /* 空閒／開心偏低時，晚年再多扣一點 */
    if (age >= 55 && (S.t < 35 || S.hap < 35)) d[0] -= 1;
    /* 已體弱：晚年再加速（危急提示本身不會把健康歸零） */
    if (age >= 55 && S.h < 45) d[0] -= 1;
    /* 學生壓力 */
    if (isStudent()) { d[2] -= 1; if (age % 2 === 0) d[0] -= 1; }
    /* 工作壓縮空閒：高峰期隔年扣，避免與育兒疊加螺旋 */
    if (age >= 35 && age < 52 && isWorking() && age % 2 === 0) d[2] -= 1;
    if (S.path === "specialist" && isWorking() && age % 3 === 0) d[2] -= 1;
    if (S.sideJob >= 2 && isWorking()) d[2] -= 1; /* 重度副業食時間 */
    /* 決策的每年持續效果（住屋／車開支已在 yearLivingCost，唔雙重扣金錢） */
    if (S.save) d[1] += 1;                 /* 儲蓄習慣→每年多留一點 */
    if (S.mpf && age >= 30 && !S.retired) d[5] += (age % 3 === 0 ? 1 : 0);
    if (S.emergency) d[5] += (age % 4 === 0 ? 1 : 0);
    if (S.savingHome) { d[5] += (age % 3 === 0 ? 1 : 0); } /* 鎖儲首期：安全感，金錢已在生活成本 */
    if (S.spouseStayHome && kidsYoung(S)) { d[4] += 1; d[2] -= 1; } /* 關係↑時間↓；金錢在 livingCost */
    if (S.partner && !S.married) { d[3] += 1; } /* 拍拖開心；約會開支在 livingCost */
    /* 無伴侶無子女：關係／安全感／開心基線明顯較低（對比家庭線） */
    if (isSingleLife(S) && age >= 26) {
      d[4] -= 1;
      d[5] -= 1;
      if (age % 2 === 0) d[3] -= 1;
    }
    /* 寵物：小幅補關係／開心，遠不及伴侶＋子女 */
    if (S.hasPet) {
      if (age % 2 === 0) d[4] += 1;
      if (age % 3 === 0) d[3] += 1;
    }
    if (S.leverageStock >= 1) d[5] -= (age % 2 === 0 ? 1 : 0); /* 高槓桿：長期不安 */
    if (S.will || S.estate) d[5] += (age % 5 === 0 ? 1 : 0);
    /* FIRE／退休：空閒明顯回升（核心修正） */
    if (S.earlyFI || S.retired) {
      d[2] += 4;
      if (S.t < 55) d[2] += 3;
      if (S.t < 40) d[2] += 2;
      if (!S.lightWorkOnly) d[3] += 1;
    } else if (age >= 58) {
      d[2] += (age % 2 === 0 ? 1 : 0);
    }
    if (S.lightWorkOnly) d[2] -= 1; /* FIRE 後兼職略食時間 */
    /* FIRE 減壓但唔等於無敵：暴飲暴食／少運動仍傷身 */
    if (S.earlyFI && S.lifestyle >= 3 && age % 2 === 0) d[0] -= 2;
    if (S.earlyFI && S.lifestyle <= 1) d[0] += 1;
    if (S.exercising) d[0] += (age >= 55 ? 1 : 2); /* 運動可減慢衰退，晚年無法完全抵銷 */
    if (S.prudence >= 4 && age % 2 === 0) d[0] += 1; /* 長期審慎生活習慣 */
    const inc = yearIncome(age);
    const cost = yearLivingCost(age);
    d[1] += inc - cost;
    if (S.invest > 0 && age >= 27) {
      const r = Math.random();
      if (r < 0.30) d[1] -= 1 + Math.min(2, S.invest);
      else if (r < 0.50) d[1] -= 1;
      else if (r < 0.75) { }
      else d[1] += 1 + Math.min(1, S.invest);
    }
    /* 年幼 vs 年長：時間差別仍明顯（幼 -2／長 0／空巢 +2） */
    if (kidsYoung(S)) {
      d[2] -= 2;           /* 年幼極耗時間 */
      d[3] += 2;           /* 天倫之樂 */
      if (age % 3 === 0) d[0] -= 1; /* 偶發熬夜 */
      if (age % 2 === 0) d[4] += 1;
    } else if (kidsOlder(S) && kidYears(S) < 22) {
      /* 年長：時間明顯回升（唔再每年 -1），改為學費壓力在金錢／安全感 */
      d[3] -= (S.eduSave ? 0 : 1);
      d[4] += 1;
      if (!S.eduSave && age % 2 === 0) d[5] -= 1;
      if (age % 3 === 0) d[2] += 1; /* 孩子漸獨立，偶有空閒回升 */
    } else if (S.kids && kidYears(S) >= 22) {
      d[2] += 2;           /* 空巢明顯鬆一口气 */
      d[3] += 1;
    }
    /* 時間見底但非育兒高峰：輕微自然回彈，避免不可逆螺旋 */
    if (S.t < 25 && !kidsYoung(S) && !S.sideJob) d[2] += 2;
    if (S.t < 35 && S.exercising) d[2] += 1;
    /* 缺乏個人時間 → 開心下跌 */
    const tNow = clamp(S.t + d[2]);
    if (tNow < 20) d[3] -= 3;
    else if (tNow < 30) d[3] -= 2;
    else if (tNow < 40) d[3] -= 1;
    if (S.h < 30) d[3] -= 2; /* 體弱拖累心情 */
    if (S.w < 0) { d[3] -= 1; d[5] -= 1; }
    /* 空閒少＋開心低 → 健康下滑（保留死亡路徑，但唔每年 -4 螺旋） */
    const hapNow = clamp(S.hap + d[3]);
    if (tNow < 20 && hapNow < 30) d[0] -= 3;
    else if (tNow < 28 && hapNow < 35) d[0] -= 2;
    else if (tNow < 35 && hapNow < 35) d[0] -= 1;
    else if (tNow < 40 && hapNow < 40 && age % 2 === 0) d[0] -= 1;
    apply(d);
    return { d: d, income: inc, cost: cost };
  }

  function chipsHTML(d) {
    const parts = [];
    d.forEach((v, i) => {
      if (!v) return;
      parts.push('<span class="chip ' + (v > 0 ? "up" : "dn") + '">' + SHORT[i] + (v > 0 ? " ▲+" : " ▼") + Math.abs(v) + "</span>");
    });
    return parts.join("") || '<span class="chip">無變化</span>';
  }

  function shortFeel(lab, d) {
    const items = d.map((v, i) => ({ v, i, a: Math.abs(v) })).filter(x => x.v).sort((a, b) => b.a - a.a).slice(0, 2);
    if (!items.length) return lab;
    return lab + "：" + items.map(x => SHORT[x.i] + (x.v > 0 ? "↑" : "↓")).join("　");
  }

  function showToast(main, d, done) {
    document.getElementById("toastMain").textContent = main;
    document.getElementById("toastChips").innerHTML = chipsHTML(d || [0,0,0,0,0,0]);
    toastFn = typeof done === "function" ? done : null;
    document.getElementById("toast").classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(hideToast, 900);
  }

    const fallback = popupPending.renameKind === "pet" ? defaultPetName() : defaultKidName();

  function resolvePopupChoice(cq, opt, done) {
    let d = (opt.d || [0,0,0,0,0,0]).slice();
    d = resolveRisk(opt, d);
    apply(d);
    const stageBefore = bafsStageId(S);
    if (opt.scamHit) { S.everDebt = S.everDebt || d[1] < -8; S.prudence = Math.max(0, (S.prudence || 0) - 0); }
    if (opt.prudence) S.prudence += opt.prudence;
    if (opt.insured) S.insured = true;
    if (opt.emergency) { S.emergency = true; S.prudence += 1; }
    if (opt.invest) S.invest = (S.invest || 0) + opt.invest;
    if (opt.leverageStock) S.leverageStock = (S.leverageStock || 0) + 1;
    if (opt.cert) { S.cert = Math.max(S.cert || 0, opt.cert); }
    if (opt.sideJob != null) S.sideJob = Math.max(0, opt.sideJob);
    if (opt.clearSideJob) S.sideJob = 0;
    if (opt.lightWorkOnly === false) S.lightWorkOnly = false;
    if (opt.stopStudentPT) S.studentPartTime = false;
    if (opt.cutLifestyle) {
      const n = opt.cutLifestyle === true ? 2 : Math.abs(opt.cutLifestyle);
      S.lifestyle = Math.max(0, (S.lifestyle || 0) - n);
    }
    if (opt.setLifestyle != null) S.lifestyle = Math.max(0, opt.setLifestyle);
    if (opt.clearLeverage) {
      S.leverageStock = 0;
      S.leverage = Math.max(0, (S.leverage || 0) - 1);
    }
    if (opt.exercising) S.exercising = true;
    if (opt.sellCar) S.hasCar = false;
    if (opt.spouseReturnWork) S.spouseStayHome = false;
    if (opt.pauseTravel) S.travel = false;
    if (opt.kidsAllowance) { S.kidsAllowance = true; S.kidsAllowanceAsked = true; }
    if (cq && (cq.storyKidsAllowance || cq.needKidsAllowanceOffer || cq.id === "kids_allowance_major")) S.kidsAllowanceAsked = true;
    if (opt.pet) { S.hasPet = true; if (!S.petName) S.petName = defaultPetName(); S.petAsked = true; }
    if (opt.needEmergencyPrefer && S.emergency) {
      /* 有應急：實際扣款較少 */
      if (d[1] < -2) { S.w += 2; d[1] += 2; }
      d[5] += 1; S.sec = clamp(S.sec + 1);
    }
    pushStageVerdicts(opt, stageBefore);
    S.conseqUsed[cq.id] = S.age;
    S.lastConseqId = cq.id;
    S.decisions += 1;
    scheduleSync("playing");
    logEvent(personalizeKidLog(cq.sit || cq.log || "機會／風險") + " → 選擇「" + opt.lab + "」", cq.kind === "good" ? "good" : "bad");
    if (opt.scamHit) logEvent("原來是一場騙局／陷阱，損失已造成。", "bad");
    if (opt.kidsAllowance) logEvent("開始收取子女家用（小額穩定）。", "good");
    hidePopupImmediate();
    renderHUD();
    showToast(shortFeel(opt.lab, d), d, () => {
      if (checkKO()) {
        logEvent(S.dead ? "健康歸零，人生提早結束。" : "負債過深，人生被迫中斷。", "bad");
        endGame(); return;
      }
      if (typeof done === "function") done();
    });
  }

  function rollConsequence() {
    const pool = CONSEQ.filter(c => {
      try {
        if (!c.need(S)) return false;
        /* 本局出現過嘅機會／風險 id 永不重覆 */
        if (S.conseqUsed[c.id] != null) return false;
        return true;
      } catch (e) { return false; }
    });
    if (!pool.length) return null;
    /* 審慎越高，壞事機率略降、好事略升 */
    const luck = Math.min(0.12, (S.prudence || 0) * 0.02);
    const shuffled = pool.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < shuffled.length; i++) {
      const c = shuffled[i];
      let ch = c.chance;
      if (c.kind === "bad") ch = Math.max(0.02, ch - luck);
      if (c.kind === "good") ch = Math.min(0.35, ch + luck);
      if (Math.random() < ch) return c;
    }
    /* 保底：從未抽中時，從未用過池隨機取一個 */
    if (shuffled.length && Math.random() < 0.35) return shuffled[0];
    return null;
  }

  function applyConsequence(c) {
    const d = c.d.slice();
    apply(d);
    if (c.forceDebt && S.w >= 0) {
      S.w = Math.min(-2, S.w - 6);
      S.everDebt = true;
    }
    if (c.kind === "bad" && c.id.indexOf("crash") >= 0 && S.leverageStock > 0) {
      S.leverageStock = Math.max(0, S.leverageStock - 1);
    }
    S.conseqUsed[c.id] = S.age;
    S.lastConseqId = c.id;
    const msg = personalizeKidLog(c.log);
    logEvent(msg, c.kind === "good" ? "good" : "bad");
    return d;
  }

  /* —— 自由行動：財務自由／結婚／生孩子（條件達成時出現於主畫面） —— */
  function fiEligible() {
    if (!S) return false;
    if (S.age < 40) return false;
    if (S.w < 36) return false; /* 與 KEY 41 門檻對齊 */
    if (S.w < 0) return false;  /* 仍在借貸中不算財務自由 */
    if ((S.leverage || 0) >= 2 && S.w < 42) return false; /* 高槓桿時要求更高淨資產 */
    return true;
  }
  function canTravelFree() {
    if (!S) return false;
    if (S.w < 28) return false;
    if (!(fiEligible() || S.earlyFI || S.retired)) return false;
    if (S.lastTravelAge != null && (S.age - S.lastTravelAge) < 2) return false;
    return true;
  }
  function canRetireFree() {
    if (!S) return false;
    if (!fiEligible()) return false;
    if (S.retired || S.earlyFI) return false;
    if (isStudent()) return false;
    if (!S.career) return false;
    return true;
  }
  function canShowFI() {
    return canRetireFree() || canTravelFree();
  }
  function canShowMarry() {
    /* 必須真正交往（partner）；「先做朋友」不會設 partner */
    return !!(S && S.partner && !S.married && !S.refusedPartner);
  }
  function canShowKids() {
    if (!S || !S.married || S.kids) return false;

    if (src.needPartner && S.partner && !S.married) w += 2;

    if (src.needKidsAllowanceOffer) w += 4;

  function pickRand() {
    let pool = RAND.map((_, i) => i).filter(i => {
      if (S.randUsed.indexOf(i) >= 0) return false;
      return eventAllowed(RAND[i]);
    });
    if (!pool.length) {
      S.randUsed = [];
      pool = RAND.map((_, i) => i).filter(i => eventAllowed(RAND[i]));
    }
    if (!pool.length) {
      /* 後備：平穩年 */
      return { sit: "今年大致平穩。", fin: true, opts: [
        { k: "A", lab: "繼續儲蓄", d: [0, 2, 0, 0, 0, 2] },
        { k: "B", lab: "輕鬆過", d: [1, -2, 2, 4, 1, 0] }
      ]};
    }
    /* 加權抽樣 */
    const weights = pool.map(i => stageWeight(RAND[i]));
    let sum = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * sum;
    let idx = pool[0];
    for (let j = 0; j < pool.length; j++) {
      r -= weights[j];
      if (r <= 0) { idx = pool[j]; break; }
    }
    S.randUsed.push(idx);
    if (S.randUsed.length > 10) S.randUsed.shift();
    return RAND[idx];
  }

      S.age += 1;
      yearsDone += 1;
      scheduleSync("playing");
      const pass = yearlyPass(S.age);
      if (pass.d) pass.d.forEach((v, i) => { sumD[i] += v; });
      sumInc += pass.income || 0;
      sumCost += pass.cost || 0;

      if (checkKO()) break;

      graduated = wasStudent && !isStudent() && S.career === "edu" && !S.gotFirstJob;
      if (graduated) break;

      /* 跳過本年關鍵但不合資格的歲數，避免日後卡住 */
      if (KEY[S.age] && !S.doneKey[S.age] && !eventAllowed(KEY[S.age])) {
        S.doneKey[S.age] = true;
      }

      /* 2x／4x／8x：整批跳滿所選年數，途中的關鍵決策先記下，跳完再逐一出現 */
      if (jumpingBatch) {
        if (keyEligible(S.age)) pendingKeyAges.push(S.age);
        if (yearsDone < maxYears && S.age < 68) continue;
        break;
      }

      /* 1x 或「快轉到下一個抉擇」：遇關鍵決策／危急／自由行動即停；隨機機會卡不打斷 */
      if (yearsDone < maxYears && S.age < 68 && !shouldStopFastForward()) {
        continue;
      }
      break;
    }

    const net = sumInc - sumCost;
    let yearNote;
    if (yearsDone > 1) {
      yearNote = "由 " + startAge + " 歲來到 " + S.age + " 歲（跳了 " + yearsDone + " 年）。";
    } else {
      yearNote = "又長大一歲。";
    }
    if (sumInc || sumCost) {
      yearNote += "收入+" + sumInc + "，開支-" + sumCost +
        "（淨" + (net >= 0 ? "+" : "") + net + "）。";
    }
    logEvent(yearNote, net < 0 ? "bad" : "note");
    renderHUD();

    if (checkKO()) {
      const msg = S.dead ? "健康歸零" : "負債過深";
      logEvent(S.dead ? "健康歸零，人生提早結束。" : "負債過深，人生被迫中斷。", "bad");
      showToast(msg, sumD, () => { agingLock = false; endGame(); });
      return;
    }

    const incNote = "　收入+" + sumInc + "　開支-" + sumCost +
      (net >= 0 ? "　淨+" : "　淨") + net;
    const toastAge = yearsDone > 1
      ? (startAge + "→" + S.age + " 歲")
      : (S.age + " 歲");

    /* 升學畢業＝離開學生身分：彈「找到工作」大事 */
    if (graduated) {
      S.gotFirstJob = true;
      S._jobStartShown = true;
      showToast(toastAge + incNote, sumD, () => {
        showPopup({
          kind: "fin", major: true, emo: "🎓", tag: "人生大事・畢業入職",
          main: "你畢業了，並找到第一份全職工作！",
          sub: "學生身分結束；之後會有薪酬、花紅、加班、轉工等事業決策。",
          okLabel: "繼續", d: null
        }, () => {
          logEvent("畢業並找到第一份工作。", "fin");
          afterYearlyPass();
        });
      });
      return;
    }

    showToast(toastAge + incNote, sumD, afterYearlyPass);
  }

  function resolveRisk(opt, d) {
    if (!opt.risk) return d;
    const loss = Math.abs(opt.riskLoss != null ? opt.riskLoss : 10);
    const mild = Math.abs(opt.riskMild != null ? opt.riskMild : 4);
    const win = Math.abs(opt.riskWin != null ? opt.riskWin : 8);
    const r = Math.random();
    if (opt.risk === "high") {
      /* 高風險：多數蝕（約 70%） */
      if (r < 0.45) d[1] = -loss;
      else if (r < 0.70) d[1] = -mild;
      else if (r < 0.85) d[1] = -1;
      else d[1] = win;
      d[5] = Math.min(d[5], r < 0.70 ? -Math.abs(d[5] || 6) : d[5]);
    } else if (opt.risk === "med") {
      if (r < 0.35) d[1] = -loss;
      else if (r < 0.60) d[1] = -mild;
      else if (r < 0.80) d[1] = Math.max(-1, opt.d[1]);
      else d[1] = win;
    }
    return d;
  }

  function scoreGoals() {
    if (!S.goals.length) return 0;
    let hit = 0;
    S.goals.forEach(g => {
      if (g === "stable" && S.sec >= 55 && S.w >= 20) hit++;
      if (g === "family" && S.rel >= 55 && (S.married || S.kids)) hit++;
      if (g === "career" && S.w >= 35 && (S.career === "edu" || S.cert >= 1)) hit++;
      if (g === "travel" && (S.travel || S.hap >= 55)) hit++;
      if (g === "freedom" && S.w >= 45 && S.sec >= 50) hit++;
      if (g === "health" && S.h >= 40 && S.hap >= 45) hit++;
    });
    return hit / S.goals.length;
  }

  function pickEnding() {
    if (S.dead) return "healthOut";
    if (S.bankrupt) return "bankrupt";
    const avg = (S.h + Math.max(0, S.w) + S.t + S.hap + S.rel + S.sec) / 6;
    const goalHit = scoreGoals() >= 0.5;
    if (S.w >= 40 && (S.rel < 40 || S.sec < 40)) return "richUneasy";
    if (goalHit && S.hap >= 55 && S.sec >= 50 && S.w >= 15) return "happy";
    if (goalHit && (S.w < 20 || S.sec < 45)) return "dreamer";
    if (S.everDebt || S.hap < 40 || S.sec < 35) return "thrilling";
    if (avg >= 45) return "balanced";
    if (goalHit) return "dreamer";
    return "balanced";
  }

  function endGame() {
    clearAutoAge();
    if (!S.bankrupt && !S.dead && S.age < 68) S.age = 68;
    agingLock = false;
    S.phase = "end";
    renderHUD();
    show("end");
    const en = ENDINGS[pickEnding()];
    document.getElementById("endingName").textContent = en.name;
    document.getElementById("endingBlurb").textContent = en.blurb + "　（共 " + S.decisions + " 次決策）";
    document.getElementById("finalStats").innerHTML = STATS.map(m => {
      const b = band(m.key, S[m.key]);
      return "<div><strong>" + m.lab + "</strong> " + S[m.key] +
        "　<span class='band " + b.tier + "'>" + b.word + "</span></div>";
    }).join("");
    const sc = scoreGoals();
    document.getElementById("goalResult").textContent =
      "目標達成度：" + Math.round(sc * 100) + "%　｜　" +
      (S.goals.map(g => GOALS.find(x => x.id === g).label).join("、") || "無");
    document.getElementById("stageSummary").innerHTML = renderStageSummaryHTML(S);
    document.getElementById("reviewList").innerHTML = S.history.length
      ? S.history.map(h => {
          const w = h.after.w;
          const note = w <= DEBT_KO ? "負債過深" : w < 0 ? "借貸中" : w < 20 ? "偏緊" : "尚可";
          return "<li><strong>" + h.age + "歲　" + h.title + "</strong><br>→ " + h.choice + "<br>階段：" + note + "</li>";
        }).join("")
      : "<li>無重大決策紀錄</li>";
    syncNow("ended");
  }

  function applyOptFlags(opt, age) {
    if (opt.career) S.career = opt.career;
    if (opt.jobLevel) S.jobLevel = Math.min(5, (S.jobLevel || 0) + (opt.jobLevel === true ? 1 : opt.jobLevel));
    if (opt.jobStart || opt.jobChange) S.gotFirstJob = true;
    if (opt.emergency) { S.emergency = true; S.prudence += 1; }
    if (opt.save) { S.save = opt.save; S.prudence += 1; }
    if (opt.cert != null) { S.cert = opt.cert; if (opt.cert >= 1) S.prudence += 1; }
    if (opt.travel) S.travel = true;
    if (opt.partner) { S.partner = true; S.refusedPartner = false; if (!S.partnerName) S.partnerName = who().crush; }
    if (opt.refusePartner) { S.refusedPartner = true; S.partner = false; S.partnerName = null; }
    if (opt.declinedMarry) S.declinedMarry = true;
    if (opt.marry) { S.married = true; S.partner = true; S.refusedPartner = false; S.declinedMarry = false; }
    if (opt.kids) { S.kids = true; if (S.kidsBirthAge == null) S.kidsBirthAge = age; if (!S.kidName) S.kidName = defaultKidName(); }
    if (opt.pet) { S.hasPet = true; if (!S.petName) S.petName = defaultPetName(); S.petAsked = true; }
    if (opt.petAsk || opt._petAsk) S.petAsked = true;
    if (opt.kidsAllowance) { S.kidsAllowance = true; S.kidsAllowanceAsked = true; }
    if (opt.path) S.path = opt.path;
    if (opt.mpf) { S.mpf = opt.mpf; S.prudence += 1; }
    if (opt.invest) S.invest = (S.invest || 0) + opt.invest;
    if (opt.eduSave) S.eduSave = opt.eduSave;
    if (opt.retire) { S.retired = true; S.semiRetired = false; S.earlyFI = true; S.t = clamp(Math.max(S.t, 55) + 8); }
    if (opt.semiRetire) { S.semiRetired = true; S.retired = false; }
    if (opt.earlyFI) { S.earlyFI = true; S.semiRetired = true; S.t = clamp(Math.max(S.t, 55) + 8); }
    if (opt.lightWork) S.lightWorkOnly = true;
    if (opt.lifestyle) S.lifestyle = Math.max(S.lifestyle || 0, opt.lifestyle);
    if (opt.prudence) S.prudence += opt.prudence;
    if (opt.will) { S.will = true; S.estateAsked = true; S.prudence += 1; }
    if (opt.estate) { S.estate = true; S.estateAsked = true; S.prudence += 1; }
    if (opt.estateAsk || opt._estateAsk) S.estateAsked = true;
    if (opt.car) S.hasCar = true;
    if (opt.renting) S.renting = true;
    if (opt.savingHome) S.savingHome = true;
    if (opt.hasHome) { S.hasHome = true; S.renting = false; }
    if (opt.biggerHome) S.biggerHome = true;
    if (opt.insured) S.insured = true;
    if (opt.spouseStayHome) S.spouseStayHome = true;
    if (opt.studentPartTime) S.studentPartTime = true;
    if (opt.honeymoonDone) S.honeymoonDone = true;
    if (opt.lever) { S.leverage = (S.leverage || 0) + 1; if (!S.emergency) deepenDebt(); }
    if (opt.leverageStock) S.leverageStock = (S.leverageStock || 0) + 1;
    if (opt.risk === "high") S.leverage = (S.leverage || 0) + 1;
    if (opt.sellCar) S.hasCar = false;
    if (opt.exercising) S.exercising = true;
    if (opt.clearLeverage) { S.leverageStock = 0; S.leverage = Math.max(0, (S.leverage || 0) - 1); }
    if (opt.cutLifestyle) {
      const n = opt.cutLifestyle === true ? 2 : Math.abs(opt.cutLifestyle);
      S.lifestyle = Math.max(0, (S.lifestyle || 0) - n);
    }
    if (opt.setLifestyle != null) S.lifestyle = Math.max(0, opt.setLifestyle);
    if (opt.clearSideJob) S.sideJob = 0;
    if (!opt.risk && !opt.lever && (opt.d[5] || 0) >= 5) S.prudence += 1;
  }

  function simulatePath(pathMap, label, goalList) {
    S = fresh();
    S.gender = "male";
    S.goals = goalList || ["stable", "freedom"];
    const contradictions = [];
    const hit = [];
    const skipped = [];
    const jobEventsWhileStudent = [];
    const jobEventsAfterFI = [];
    let tBeforeFI = null, tAfterFI = null;

    for (let age = 18; age <= 68; age++) {
      if (age > 18) {
        S.age = age;
        yearlyPass(age);
      } else {
        S.age = 18;
      }
      if (S.w <= DEBT_KO) { S.bankrupt = true; break; }
      if (S.h <= 0) { S.dead = true; S.h = 0; break; }

      /* 測試：退休＋子女關係好 → 模擬家用大事（預設接受，除非 pathMap.__refuseAllowance） */
      if (canOfferKidsAllowance()) {
        S.kidsAllowanceAsked = true;
        if (!pathMap.__refuseAllowance) {
          S.kidsAllowance = true;
          apply([1, 4, 0, 3, 4, 3]);
          hit.push({ age, title: "子女家用", choice: "欣然接受", w: S.w, t: S.t });
        } else {
          hit.push({ age, title: "子女家用", choice: "謝絕", w: S.w, t: S.t });
        }
      }

      /* 抽樣：學生期不可有 needJob 隨機事件 */
      if (isStudent()) {
        RAND.forEach((ev, i) => {
          if (ev.needJob && eventAllowed(ev)) jobEventsWhileStudent.push({ age, i, sit: ev.sit });
        });
      }
      if (S.earlyFI || S.retired) {
        RAND.forEach((ev, i) => {
          if (ev.needJob && eventAllowed(ev)) jobEventsAfterFI.push({ age, i, sit: ev.sit });
        });
      }

      const src = KEY[age];
      if (!src) continue;
      if (S.doneKey[age]) continue;
      if (!eventAllowed(src)) {
        skipped.push({ age, title: src.title, reason: "gated" });
        S.doneKey[age] = true;
        continue;
      }
      const k = pathMap[age] || "A";
      const opt = src.opts.find(o => o.k === k) || src.opts[0];
      const t0 = S.t;
      let dd = opt.d.slice();
      /* 測試用：高風險固定取中間結果，避免隨機干擾斷言 */
      if (opt.risk === "high") dd[1] = -(opt.riskMild != null ? opt.riskMild : 6);
      else if (opt.risk === "med") dd[1] = -(opt.riskMild != null ? opt.riskMild : 2);
      const stageBefore = bafsStageId(S);
      apply(dd);
      applyOptFlags(opt, age);
      pushStageVerdicts(opt, stageBefore);
      if (src.estateAsk) S.estateAsked = true;
      if (src.petAsk) S.petAsked = true;
      if (src.needKidsAllowanceOffer || src.storyKidsAllowance) S.kidsAllowanceAsked = true;
      if (opt.earlyFI || opt.retire) {
        tBeforeFI = t0;
        tAfterFI = S.t;
        if (opt.earlyFI && S.w < 30) contradictions.push("FIRE_wealth_too_low:" + S.w);
      }
      S.doneKey[age] = true;
      S.decisions++;
      hit.push({ age, title: src.title || src.sit, choice: opt.lab, w: S.w, t: S.t });
      S.history.push({ age, title: src.title, choice: opt.lab, after: { w: S.w, t: S.t } });

      /* 即時矛盾檢查 */
      if (src.needJob && isStudentState({ career: S.career, age: age, retired: false, earlyFI: false })) {
        /* 決策當下若仍是學生卻出了 needJob——不應發生 */
      }
      if ((opt.marry || (src.marry && opt.marry)) && S.refusedPartner && !opt.marry) {
        contradictions.push(age + ": marry after refuse");
      }
    }

    /* 邏輯斷言 */
    if (jobEventsWhileStudent.length)
      contradictions.push("student_got_job_events:" + jobEventsWhileStudent.length);
    if (jobEventsAfterFI.length)
      contradictions.push("fi_got_job_events:" + jobEventsAfterFI.length);

    /* 升學路線：20 歲「第一份薪酬」必須被 gate */
    if (pathMap[18] === "A") {
      const salary20 = hit.find(h => h.age === 20);
      if (salary20) contradictions.push("edu_path_got_salary_at_20");
      const skip20 = skipped.find(s => s.age === 20);
      if (!skip20) contradictions.push("edu_path_20_not_skipped");
    }
    /* 早職：20 應出現 */
    if (pathMap[18] === "B") {
      if (!hit.find(h => h.age === 20)) contradictions.push("work_path_missed_salary_20");
    }
    /* 拒絕追求：不可結婚／生育 */
    if (pathMap[26] === "C") {
      if (S.married) contradictions.push("refused_but_married");
      if (S.kids) contradictions.push("refused_but_kids");
      if (hit.find(h => h.age === 30)) contradictions.push("refused_but_got_marry_event");
      if (hit.find(h => h.age === 34)) contradictions.push("refused_but_got_kids_event");
    }
    /* 先做朋友：不可變成戀愛中、不記拒絕、無約會生活開支 */
    if (pathMap[26] === "B") {
      if (S.partner) contradictions.push("friendzone_but_partner_true");
      if (S.refusedPartner) contradictions.push("friendzone_but_refusedPartner");
      if (S.partnerName) contradictions.push("friendzone_but_partnerName_set");
      if (S.married) contradictions.push("friendzone_but_married");
      /* 用奇數歲測：偶數歲單身應酬＋1 會與約會＋1 抵消 */
      const prevP = S.partner; const prevM = S.married;
      S.partner = false; S.married = false;
      const costSingle = yearLivingCost(27);
      S.partner = true;
      const costDating = yearLivingCost(27);
      S.partner = prevP; S.married = prevM;
      if (!(costDating === costSingle + 1)) contradictions.push("dating_living_cost_missing:" + costSingle + "->" + costDating);
      /* 靜態：先做朋友選項不可帶 partner:true */
      const fzOpt = (KEY[26] && KEY[26].opts || []).find(o => o.k === "B");
      if (fzOpt && fzOpt.partner) contradictions.push("friendzone_opt_still_has_partner_flag");
      if (fzOpt && fzOpt.refusePartner) contradictions.push("friendzone_opt_has_refusePartner");
    }
    /* 接受追求並結婚生育 */
    if (pathMap[26] === "A" && pathMap[30] === "B" && pathMap[34] === "A") {
      if (!S.partner && !S.married) contradictions.push("accept_but_no_partner");
      if (!S.married) contradictions.push("marry_choice_but_not_married");
      if (!S.kids) contradictions.push("kids_choice_but_no_kids");
    }
    /* FIRE 後空閒應明顯上升 */
    if (tBeforeFI != null && tAfterFI != null) {
      if (tAfterFI < tBeforeFI + 5 && tAfterFI < 50)
        contradictions.push("FIRE_leisure_not_up:" + tBeforeFI + "->" + tAfterFI);
    }
    if (S.earlyFI && S.t < 45)
      contradictions.push("FIRE_leisure_still_low:" + S.t);
    /* 若確實在 41 歲成功 FIRE（非僅 pathMap 意圖，因 needWealth 可能跳過），之後唔應再出在職 KEY */
    const firedAt41 = hit.find(h => h.age === 41 && (pathMap[41] === "A" || pathMap[41] === "C"));
    if (firedAt41) {
      if (hit.find(h => h.age === 46)) contradictions.push("FIRE_but_got_job_switch_46");
      if (hit.find(h => h.age === 58)) contradictions.push("FIRE_but_got_early_retire_ask_58");
    }
    /* 買車旗標（僅當活到該決策） */
    if (hit.find(h => h.age === 38) && (pathMap[38] === "A" || pathMap[38] === "C")) {
      if (!S.hasCar) contradictions.push("car_choice_but_no_flag");
    }
    /* 槓桿（僅當活到該決策） */
    if (hit.find(h => h.age === 27) && pathMap[27] === "B") {
      if (S.leverageStock < 1) contradictions.push("high_risk_no_leverage_flag");
    }
    if (hit.find(h => h.age === 52) && pathMap[52] === "B") {
      if (S.leverageStock < 1) contradictions.push("rebalance_high_risk_no_lev_flag");
    }
    /* 半工讀 20 歲應有薪酬決策 */
    if (pathMap[18] === "C") {
      if (!hit.find(h => h.age === 20) && !S.dead && !S.bankrupt)
        contradictions.push("mix_path_missed_salary_20");
    }
    /* Lisa 文案不重覆 */
    const confessSit = resolveStory({ storyConfess: true });
    if (confessSit.title && confessSit.sit && confessSit.sit.indexOf(confessSit.title) >= 0)
      contradictions.push("lisa_title_duplicates_sit");
    if ((confessSit.title + confessSit.sit).split("表白").length - 1 > 1)
      contradictions.push("lisa_double_表白");

    /* 遺產相關 KEY 至多一次 */
    const estateHits = hit.filter(h => /遺囑|遺產/.test(h.title || ""));
    if (estateHits.length > 1) contradictions.push("estate_asked_twice:" + estateHits.map(h => h.age).join(","));
    const ending = pickEnding();

    return {
      label, age: S.age, w: S.w, h: S.h, t: S.t, hap: S.hap, rel: S.rel, sec: S.sec, career: S.career,
      earlyFI: S.earlyFI, retired: S.retired, married: S.married, kids: S.kids,
      hasPet: S.hasPet, petName: S.petName, kidsAllowance: S.kidsAllowance,
      hasCar: S.hasCar, leverageStock: S.leverageStock, refusedPartner: S.refusedPartner,
      will: S.will, estate: S.estate, estateAsked: S.estateAsked,
      dead: S.dead, bankrupt: S.bankrupt, ending, endingName: ENDINGS[ending].name,
      hit: hit.length, skipped: skipped.length, decisions: S.decisions,
      tBeforeFI, tAfterFI, contradictions, hitAges: hit.map(h => h.age),
      skippedAges: skipped.map(s => s.age), estateHits: estateHits.map(h => h.age + ":" + h.title),
      stageSummary: stageSummaryPayload(S), stageVerdicts: (S.stageVerdicts || []).slice()
    };
  }

      if (S.h <= 0) { healthyDead = true; break; }
    }
    if (healthyDead || S.age < 68) results[0].contradictions.push("healthy_path_died_before_68");

    S = fresh(); S.gender = "male"; S.goals = ["health"]; S.h = 32; S.t = 22; S.hap = 22; S.rel = 30; S.sec = 30;
    S.retired = true; S.exercising = false; S.prudence = 0; S.w = 20;
    let deathAge = null;
    const frailTrack = [{ age: 54, h: S.h }];
    for (let age = 55; age <= 68; age++) {
      S.age = age; yearlyPass(age);
      frailTrack.push({ age, h: S.h });
      if (S.h <= 0) { S.dead = true; S.h = 0; deathAge = age; break; }
    }
    const healthOutReachable = !!S.dead;
    if (!healthOutReachable) results[0].contradictions.push("healthOut_not_reachable_from_frail_start");
    if (deathAge == null || deathAge < 60 || deathAge > 63)
      results[0].contradictions.push("frail_death_age_not_60_63:" + deathAge);

    /* 危急提示本身不歸零：選項 d[0/1/2] 皆非把數值設 0 的強制歸零 */
    const critBuilders = [buildCritHealth, buildCritMoney, buildCritLeisure];
    let alertForcesZero = false;
    critBuilders.forEach(fn => {
      const ev = fn();
      (ev.opts || []).forEach(o => {
        /* 改善選項應以正向／可控為主，絕不出現「直接歸零」語意旗標 */
        if (o.forceZero || o.kill || o.bankruptNow) alertForcesZero = true;
      });
    });
    if (alertForcesZero) results[0].contradictions.push("crit_alert_has_force_zero_flag");
    /* 靜態：crit sit 文案可警告，但 offerCriticalHelp 不直接改 S.h/S.w/S.t */
    const critSrc = String(offerCriticalHelp);
    if (/S\.h\s*=\s*0|S\.w\s*=\s*0|S\.t\s*=\s*0/.test(critSrc))
      results[0].contradictions.push("offerCriticalHelp_assigns_zero");

    /* 單身＋寵物：開支、改名、關係／開心低於家庭線 */
    const refuseR = results.find(r => r.label === "refuse+dating");
    const familyR = results.find(r => r.label === "prudent+family");
    S = fresh(); S.gender = "male"; S.goals = ["stable"]; S.refusedPartner = true;
    S.age = 29;
    const petKey = KEY[29];
    if (!petKey || !eventAllowed(petKey)) results[0].contradictions.push("pet_key_not_allowed_when_single");
    const petOpt = petKey.opts.find(o => o.pet);
    apply(petOpt.d.slice()); applyOptFlags(petOpt, 29); S.petAsked = true;
    if (!S.hasPet || !S.petName) results[0].contradictions.push("pet_flag_or_name_missing");
    S.petName = "豆豆測試";
    if (who().pet !== "豆豆測試") results[0].contradictions.push("pet_rename_who_fail");
    const costPet = yearLivingCost(30);
    S.hasPet = false;
    const costNoPet = yearLivingCost(30);
    S.hasPet = true;
    if (!(costPet > costNoPet)) results[0].contradictions.push("pet_no_extra_living_cost");
    /* 單身基線：跑幾年後 rel/hap 應低於家庭線終局 */
    if (refuseR && familyR) {
      if (refuseR.rel >= familyR.rel && refuseR.hap >= familyR.hap)
        results[0].contradictions.push("single_rel_hap_not_below_family");
      if (!refuseR.hasPet && refuseR.hitAges && refuseR.hitAges.indexOf(29) >= 0) {
        /* hasPet may not be on return — check below */
      }
    }

    /* 退休＋關係好 → 家用可觸發 */
    S = fresh(); S.gender = "male"; S.age = 66; S.retired = true; S.kids = true; S.kidsBirthAge = 34;
    S.rel = 70; S.w = 30; S.h = 50; S.mpf = 1; S.career = "work";
    if (!canOfferKidsAllowance()) results[0].contradictions.push("kids_allowance_should_offer");
    const w0 = S.w;
    S.kidsAllowance = true; S.kidsAllowanceAsked = true;
    const incAllow = yearIncome(66);
    S.kidsAllowance = false;
    const incNo = yearIncome(66);
    if (!(incAllow > incNo)) results[0].contradictions.push("kids_allowance_no_income_boost");
    if (canOfferKidsAllowance()) results[0].contradictions.push("kids_allowance_should_not_reoffer");

    /* 退休事件池 */
    S = fresh(); S.gender = "male"; S.age = 66; S.retired = true; S.kids = true; S.kidsBirthAge = 34;
    S.estateAsked = true; S.will = true; S.rel = 40;
    const badEstate = RAND.filter(ev => ev.needEstateAsk && eventAllowed(ev));
    if (badEstate.length) results[0].contradictions.push("estate_still_allowed_after_asked:" + badEstate.length);
    S.estateAsked = false; S.will = false; S.estate = false;
    const retirePool = RAND.filter(ev => eventAllowed(ev) && (ev.needRetiredLife || ev.needRetired));
    const retireTags = retirePool.map(ev => {
      if (ev.storyRetireTravel || ev.storyRetireTripCost) return "travel";
      if (ev.storyRetireMedical || ev.storyRetireChronic || ev.storyRetireHospital || ev.storyRetireLTC) return "medical";
      if (ev.storyRetireFall || ev.storyRetireAccident) return "accident";
      if (ev.needEstateAsk) return "estate";
      if (ev.storyRetireVolunteer || ev.storyRetirePartTime) return "social";
      if (ev.storyRetireGrand) return "grand";
      if (ev.storyKidsAllowance) return "allowance";
      return "other";
    });

    /* 補回 refuse 路徑 hasPet 斷言 */
    const splashSim = simulatePath(workSplash, "refuse+pet-check", ["career", "stable"]);
    if (!splashSim.contradictions) {}
    /* re-read from dedicated sim with pet flag on return — extend simulatePath return */

    /* —— ⑥ 精彩但緊張：單元可達 —— */
    S = fresh(); S.gender = "male"; S.goals = ["health"]; /* goalHit 難達成 */
    S.age = 68; S.w = 28; S.h = 45; S.t = 50; S.hap = 42; S.rel = 50; S.sec = 40;
    S.everDebt = true; S.dead = false; S.bankrupt = false;
    const thrillEnd = pickEnding();
    if (thrillEnd !== "thrilling") results[0].contradictions.push("thrilling_unreachable:" + thrillEnd);

    /* —— 家庭線應可收家用（simulatePath 已模擬） —— */
    if (eduR && eduR.kids && eduR.retired && eduR.rel >= 58 && !eduR.kidsAllowance)
      eduR.contradictions.push("family_retire_no_kidsAllowance");
    if (eduR && eduR.kidsAllowance) {
      /* ok */
    }

    /* —— sellCar 旗標 —— */
    S = fresh(); S.hasCar = true;
    applyOptFlags({ sellCar: true, d: [0,0,0,0,0,0] }, 40);
    if (S.hasCar) results[0].contradictions.push("sellCar_flag_not_cleared");

    /* —— 結局本局回顧：階段摘要 —— */
    function assertStageSummary(r, expectIds, mustHaveRe, labelExtra) {
      const sum = r.stageSummary || [];
      const ids = sum.map(x => x.id);
      expectIds.forEach(id => {
        if (ids.indexOf(id) < 0) r.contradictions.push("stage_summary_missing_" + id + (labelExtra || ""));
      });
      /* 跳過嘅婚姻階段唔應出現 */
      if (!r.married) {
        ["2", "3", "4"].forEach(id => {
          if (ids.indexOf(id) >= 0) r.contradictions.push("stage_summary_unexpected_" + id);
        });
      }
      const flat = sum.flatMap(st => st.items.map(it => (it.ok ? "✓" : "✗") + it.text));
      (mustHaveRe || []).forEach(re => {
        if (!flat.some(t => re.test(t))) r.contradictions.push("stage_summary_missing_item:" + re);
      });
      /* 每段最多 3 條 */
      sum.forEach(st => {
        if (st.items.length > 3) r.contradictions.push("stage_summary_too_many:" + st.id + ":" + st.items.length);
      });
      /* 須有 ✓ 或 ✗ 標記語意 */
      flat.forEach(t => {
        if (!/^[✓✗]/.test(t)) r.contradictions.push("stage_summary_bad_mark:" + t);
      });
    }
    if (eduR) assertStageSummary(eduR, ["1", "2", "3", "5"], [/應急|儲蓄|保險|教育|遺囑|強積金|子女家用/], "");
    if (refusePet) assertStageSummary(refusePet, ["1"], [/寵物|單身/], "");
    const riskR = results.find(r => r.label === "high-risk+invest");
    if (riskR) assertStageSummary(riskR, ["1"], [/高風險|高槓桿/], "");
    /* 結局畫面 HTML 須含本局回顧容器 */
    if (!document.getElementById("stageSummary"))
      results[0].contradictions.push("stageSummary_dom_missing");

    const allC = results.flatMap(r => r.contradictions.map(c => r.label + ": " + c));
    console.log("=== lifeSim path tests ===");
    results.forEach(r => {
      console.log(r.label, "age", r.age, "w", r.w, "h", r.h, "t", r.t, "rel", r.rel, "hap", r.hap, "FI", r.earlyFI,
        "end", r.endingName, "estateAsked", r.estateAsked, "estateHits", (r.estateHits || []).join("|"),
        "dead", r.dead, "broke", r.bankrupt,
        "contra", r.contradictions.length, r.contradictions.join("; "));
      if (r.stageSummary) {
        console.log("  stageSummary", JSON.stringify(r.stageSummary.map(st => ({
          id: st.id, name: st.name,
          items: st.items.map(it => (it.ok ? "✓" : "✗") + it.text)
        }))));
      }
    });
    console.log("healthyTrack", JSON.stringify(healthyTrack));
    console.log("frailTrack", JSON.stringify(frailTrack));
    console.log("deathAge", deathAge);
    console.log("retireTags", retireTags.join(","));
    console.log("TOTAL contradictions:", allC.length, allC);
    return {
      results, contradictions: allC, ok: allC.length === 0,
      healthyTrack, frailTrack, retireTags, healthOutReachable, deathAge,
      petCostOk: costPet > costNoPet, allowanceBoost: incAllow - incNo,
      alertForcesZero: false,
      stageSamples: {
        family: eduR && eduR.stageSummary,
        single: refusePet && refusePet.stageSummary,
        risk: riskR && riskR.stageSummary
      }
    };
  };

  try {
    /* 已取消課室代碼／老師後台入口 */
  } catch (e) {}

})();
</script>
